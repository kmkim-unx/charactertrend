name: Daily Character Scrape

on:
  schedule:
    - cron: '0 15 * * *'  # KST 자정 (UTC 15:00)
  workflow_dispatch:        # 수동 실행 가능

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Run scraper pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python3 run_pipeline.py --sources zeta,crack,rofan --no-notion

      - name: Copy result to web/public/data
        run: |
          DATE=$(date -u +%Y-%m-%d)
          mkdir -p web/public/data
          if [ -f output/latest_result.json ]; then
            cp output/latest_result.json web/public/data/${DATE}.json
            echo "Copied output/latest_result.json → web/public/data/${DATE}.json"
          else
            echo "Warning: output/latest_result.json not found"
          fi

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/ public/data/
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%d) 랭킹 업데이트"
          git push
